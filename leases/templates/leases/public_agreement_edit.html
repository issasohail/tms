{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agreement Edit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-3" style="max-width: 920px;">
    <div class="bg-white border rounded p-3 shadow-sm">
      <h1 class="h5 mb-1">Agreement Edit</h1>
      <div class="small text-muted mb-3">Changes are saved as Pending Agreement Approval.</div>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="form-label small fw-semibold" for="{{ form.proposed_terms.id_for_label }}">{{ form.proposed_terms.label }}</label>
        {{ form.proposed_terms }}
        {% if form.proposed_terms.errors %}<div class="text-danger small">{{ form.proposed_terms.errors }}</div>{% endif %}
        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-primary btn-sm" type="submit">Submit for Approval</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
