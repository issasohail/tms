<div class="d-flex flex-nowrap align-items-center gap-1 actions-wrap">
  <a href="{% url 'properties:unit_detail' record.pk %}" class="btn btn-sm btn-info action-btn btn-view" title="View" data-bs-toggle="tooltip">
    <i class="fas fa-eye"></i><span class="btn-text ms-1">View</span>
  </a>

  <a href="{% url 'properties:unit_update' record.pk %}" class="btn btn-sm btn-warning action-btn btn-edit" title="Edit" data-bs-toggle="tooltip">
    <i class="fas fa-edit"></i><span class="btn-text ms-1">Edit</span>
  </a>

  <a href="{% url 'properties:unit_delete' record.pk %}" class="btn btn-sm btn-danger action-btn btn-delete" title="Delete" data-bs-toggle="tooltip">
    <i class="fas fa-trash"></i><span class="btn-text ms-1">Delete</span>
  </a>

  <button type="button"
          class="btn btn-sm btn-success action-btn vacant-notice-btn"
          data-unit-id="{{ record.pk }}"
          data-unit-title="{{ record.property.property_name }} - {{ record.unit_number }} Vacant Notice"
          data-leads-url="{% url 'properties:unit_vacant_notice_leads' record.pk %}"
          title="Vacant Notice"
          data-bs-toggle="tooltip">
    <i class="fab fa-whatsapp"></i><span class="btn-text ms-1">WhatsApp</span>
  </button>
</div>
