{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white py-2">Confirm Delete - Maintenance Request</div>
    <div class="card-body">
      <p>Delete <strong>{{ object.title }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="confirm_delete" value="yes" id="confirmDelete">
          <label class="form-check-label" for="confirmDelete">I understand this will delete the request and its attached maintenance files.</label>
        </div>
        <a href="{{ object.get_absolute_url }}" class="btn btn-secondary btn-sm">Cancel</a>
        <button type="submit" class="btn btn-danger btn-sm">Delete Request</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
