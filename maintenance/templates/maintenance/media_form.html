{% extends "base.html" %}

{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="mb-0">Edit Maintenance File</h4>
    <a href="{{ object.request.get_absolute_url }}" class="btn btn-secondary btn-sm">Back</a>
  </div>
  <form method="post" class="card">
    {% csrf_token %}
    <div class="card-body">
      <div class="mb-2">
        <label class="form-label">Description</label>
        {{ form.description }}
        <div class="text-danger small">{{ form.description.errors }}</div>
      </div>
      <div class="form-check">
        {{ form.is_active }}
        <label class="form-check-label">Active</label>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-between">
      <a href="{{ object.request.get_absolute_url }}" class="btn btn-secondary btn-sm">Cancel</a>
      <button type="submit" class="btn btn-primary btn-sm">Save File</button>
    </div>
  </form>
</div>
{% endblock %}
