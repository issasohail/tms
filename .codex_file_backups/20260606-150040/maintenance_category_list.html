{% extends "base.html" %}

{% block content %}
<style>
  .mc-wrap { max-width: 900px; }
  .mc-card, .mc-row {
    background:#fff;
    border:1px solid rgba(0,0,0,.08);
    border-radius:8px;
  }
  .mc-row {
    display:grid;
    grid-template-columns: 52px minmax(0, 1fr) 110px 120px;
    gap:.5rem;
    align-items:center;
    padding:.5rem .65rem;
    margin-bottom:.45rem;
  }
  .mc-head {
    display:grid;
    grid-template-columns: 52px minmax(0, 1fr) 110px 120px;
    gap:.5rem;
    padding:.35rem .65rem;
    color:#6c757d;
    font-size:.72rem;
    font-weight:700;
  }
  .mc-name { font-weight:700; overflow-wrap:anywhere; }
  .mc-tools { display:flex; flex-wrap:wrap; gap:.35rem; align-items:end; }
  .mc-tools .form-control { max-width:260px; }
  @media (max-width:520px) {
    .container.mc-wrap { padding-left:.45rem; padding-right:.45rem; }
    .mc-head { display:none; }
    .mc-row {
      grid-template-columns: 34px minmax(0, 1fr);
      padding:.5rem;
    }
    .mc-mobile-full { grid-column:2 / 3; }
  }
  @media (max-width:360px) {
    .mc-wrap, .mc-wrap .btn, .mc-wrap .form-control { font-size:.68rem; }
  }
</style>

<div class="container mc-wrap mt-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
    <h4 class="mb-0">Maintenance Categories</h4>
    <a href="{% url 'maintenance:request_list' %}" class="btn btn-secondary btn-sm">Maintenance List</a>
  </div>

  <div class="mc-card card mb-2">
    <div class="card-body py-2">
      {% csrf_token %}
      <div class="mc-tools">
        <div>
          <label class="form-label small mb-1">New Category</label>
          <input type="text" class="form-control form-control-sm js-category-name" placeholder="Category name">
        </div>
        <button type="button" class="btn btn-primary btn-sm js-category-add">Add Category</button>
        <span class="small text-muted js-category-message"></span>
      </div>
    </div>
  </div>

  <div class="mc-head">
    <div>Sr</div>
    <div>Name</div>
    <div>Status</div>
    <div class="text-end">Action</div>
  </div>

  <div id="category-list" data-add-url="{% url 'maintenance:category_create' %}">
    {% for category in categories %}
      <div class="mc-row" data-id="{{ category.id }}">
        <div class="js-sr">{{ forloop.counter }}</div>
        <div class="mc-name">{{ category.name }}</div>
        <div class="mc-mobile-full"><span class="badge bg-success">Active</span></div>
        <div class="text-end mc-mobile-full">
          <button type="button" class="btn btn-outline-danger btn-sm js-category-delete" data-delete-url="{% url 'maintenance:category_delete' category.id %}">Delete</button>
        </div>
      </div>
    {% empty %}
      <div class="text-muted p-3 bg-white border rounded" id="category-empty">No maintenance categories found.</div>
    {% endfor %}
  </div>
</div>

<script>
(function () {
  const list = document.getElementById("category-list");
  const input = document.querySelector(".js-category-name");
  const message = document.querySelector(".js-category-message");
  const csrf = document.querySelector("[name=csrfmiddlewaretoken]")?.value || "";

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function postUrl(url, payload) {
    const formData = new FormData();
    Object.keys(payload || {}).forEach(key => formData.append(key, payload[key]));
    return fetch(url, {
      method: "POST",
      headers: {"X-CSRFToken": csrf, "X-Requested-With": "XMLHttpRequest"},
      body: formData,
      credentials: "same-origin"
    }).then(async response => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) throw new Error(data.error || "Request failed.");
      return data;
    });
  }

  function rowHtml(category) {
    const sr = list.querySelectorAll(".mc-row").length + 1;
    return `
      <div class="mc-row" data-id="${category.id}">
        <div class="js-sr">${sr}</div>
        <div class="mc-name">${escapeHtml(category.name || category.text)}</div>
        <div class="mc-mobile-full"><span class="badge bg-success">Active</span></div>
        <div class="text-end mc-mobile-full">
          <button type="button" class="btn btn-outline-danger btn-sm js-category-delete" data-delete-url="${escapeHtml(category.delete_url)}">Delete</button>
        </div>
      </div>`;
  }

  function renderRows(categories) {
    document.getElementById("category-empty")?.remove();
    list.innerHTML = "";
    (categories || []).forEach(category => list.insertAdjacentHTML("beforeend", rowHtml(category)));
    renumberRows();
  }

  function renumberRows() {
    list.querySelectorAll(".mc-row .js-sr").forEach(function (cell, index) {
      cell.textContent = index + 1;
    });
  }

  document.querySelector(".js-category-add")?.addEventListener("click", function () {
    const name = (input.value || "").trim();
    if (!name) return;
    postUrl(list.dataset.addUrl, {name}).then(function (data) {
      renderRows(data.categories);
      input.value = "";
      message.textContent = data.created ? "Category added." : "Category already exists.";
    }).catch(error => alert(error.message));
  });

  input?.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      document.querySelector(".js-category-add").click();
    }
  });

  list?.addEventListener("click", function (event) {
    const button = event.target.closest(".js-category-delete");
    if (!button) return;
    const row = button.closest(".mc-row");
    const name = row.querySelector(".mc-name")?.textContent || "this category";
    if (!confirm(`Delete category "${name}" from active list?`)) return;
    postUrl(button.dataset.deleteUrl, {}).then(function (data) {
      renderRows(data.categories);
      message.textContent = "Category removed from active list.";
    }).catch(error => alert(error.message));
  });
})();
</script>
{% endblock %}
