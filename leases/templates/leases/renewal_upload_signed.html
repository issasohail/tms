{% extends 'base.html' %}

{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Upload Signed Renewal #{{ renewal.renewal_number }}</h2>
    <a href="{% url 'leases:lease_detail' lease.pk %}" class="btn btn-secondary btn-sm">Back</a>
  </div>

  <div class="card">
    <div class="card-header bg-dark text-white py-2 px-3">Signed Copy</div>
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Signed agreement file</label>
          <input type="file" name="signed_copy" class="form-control form-control-sm" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Upload</button>
        <a href="{% url 'leases:lease_detail' lease.pk %}" class="btn btn-secondary btn-sm">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
