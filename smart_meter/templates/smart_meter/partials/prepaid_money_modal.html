<div class="modal fade" id="prepaidMoneyModal" tabindex="-1" aria-labelledby="prepaidMoneyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <form method="post" id="prepaidMoneyForm">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="hidden" name="operation" id="prepaidMoneyOperation">
        <div class="modal-header">
          <h3 class="modal-title" id="prepaidMoneyModalLabel">Top up meter</h3>
          <button type="button" class="btn-close" id="prepaidMoneyHeaderClose" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="alert alert-light border border-start-0 border-end-0 rounded-0 mb-0 px-3 py-2 flex-shrink-0" id="prepaidMoneySummary">
          <div><span class="text-muted">Meter #:</span> <strong id="prepaidMoneyMeterNumber"></strong></div>
          <div><span class="text-muted">Unit #:</span> <strong id="prepaidMoneyUnit"></strong></div>
          <div><span class="text-muted">Current tenant:</span> <strong id="prepaidMoneyTenant"></strong></div>
          <div><span class="text-muted">Current balance:</span> <strong id="prepaidMoneyCurrentBalance"></strong></div>
        </div>
        <div class="modal-body prepaid-money-modal-body">
          <div id="prepaidMoneyFields" class="row g-3">
            <div class="col-md-6">
              <label for="prepaidMoneyAmount" class="form-label fs-5">Amount</label>
              <input type="number" min="0.01" step="0.01" class="form-control form-control-lg" id="prepaidMoneyAmount" name="amount" required autofocus>
            </div>
            <div class="col-md-6">
              <label for="prepaidMoneyConfirmation" class="form-label fs-5">Re-enter amount</label>
              <input type="number" min="0.01" step="0.01" class="form-control form-control-lg" id="prepaidMoneyConfirmation" name="confirm_amount" autocomplete="off" required>
              <div class="invalid-feedback">The two amounts must match.</div>
            </div>
            <div class="col-12">
              <label for="prepaidMoneyReason" class="form-label fs-5">Reason <span class="text-muted fs-6">(optional)</span></label>
              <input type="text" class="form-control form-control-lg" id="prepaidMoneyReason" name="reason" maxlength="255">
            </div>
          </div>
          <div id="prepaidMoneyProgress" class="d-none" aria-live="polite">
            <div class="progress mb-2" style="height:1.25rem" role="progressbar" aria-label="Money command progress">
              <div id="prepaidMoneyProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width:8%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"></div>
            </div>
            <div class="d-flex justify-content-between gap-3 small">
              <span id="prepaidMoneyPhase">Queueing the command…</span>
              <span id="prepaidMoneyTimer" class="font-monospace fw-semibold">00:00</span>
            </div>
            <div id="prepaidMoneyResult" class="alert mt-3 mb-0 d-none"></div>
            <a id="prepaidMoneyWhatsApp" class="btn btn-success btn-lg mt-3 d-none" href="#" target="_blank" rel="noopener noreferrer">
              <i class="fab fa-whatsapp me-1" aria-hidden="true"></i> Send to tenant on WhatsApp
            </a>
          </div>
          <p class="text-muted mt-3 mb-0">The command is sent once. This window waits for acknowledgement, reads the meter again, and shows the verified updated balance.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-lg btn-outline-secondary" id="prepaidMoneyCancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-lg btn-warning px-5" id="prepaidMoneySubmit">Submit</button>
          <button type="button" class="btn btn-lg btn-secondary d-none" id="prepaidMoneyDone" data-bs-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  (function () {
  let moneyTimer = null;
  let moneyPoll = null;
  let moneyStartedAt = null;
  let moneyBusy = false;
  let moneyTerminal = false;
  let moneyModalController = null;

  function moneyElapsed() {
    if (!moneyStartedAt) return;
    const elapsed = Math.floor((Date.now() - moneyStartedAt) / 1000);
    document.getElementById('prepaidMoneyTimer').textContent = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
    const bar = document.getElementById('prepaidMoneyProgressBar');
    const width = Math.min(92, 8 + elapsed * 2.2);
    bar.style.width = `${width}%`;
    bar.setAttribute('aria-valuenow', String(Math.round(width)));
  }

  function stopMoneyTracking() {
    clearInterval(moneyTimer);
    clearTimeout(moneyPoll);
    moneyTimer = null;
    moneyPoll = null;
  }

  function finishMoneyTracking(success, message, balance, readingAt, meterId, operationLabel, whatsappUrl) {
    stopMoneyTracking();
    moneyBusy = false;
    moneyTerminal = true;
    const bar = document.getElementById('prepaidMoneyProgressBar');
    bar.classList.remove('progress-bar-animated', 'bg-primary');
    bar.classList.add(success ? 'bg-success' : 'bg-danger');
    if (success) {
      bar.style.width = '100%';
      bar.setAttribute('aria-valuenow', '100');
    }
    const result = document.getElementById('prepaidMoneyResult');
    result.className = `alert mt-3 mb-0 ${success ? 'alert-success' : 'alert-danger'}`;
    result.textContent = success && balance
      ? `${operationLabel || 'Payment'} applied successfully. The new balance is ${balance}.${readingAt ? ` Confirmed ${new Date(readingAt).toLocaleString()}.` : ''}`
      : message;
    const whatsapp = document.getElementById('prepaidMoneyWhatsApp');
    whatsapp.classList.toggle('d-none', !(success && whatsappUrl));
    whatsapp.href = success && whatsappUrl ? whatsappUrl : '#';
    document.getElementById('prepaidMoneyPhase').textContent = success ? 'Completed and verified.' : 'Command not verified.';
    document.getElementById('prepaidMoneyDone').classList.remove('d-none');
    document.getElementById('prepaidMoneyHeaderClose').disabled = false;
    if (success && balance && meterId) {
      const row = document.querySelector(`[data-meter-row][data-meter-id="${meterId}"]`);
      if (row && typeof setBalanceCell === 'function') setBalanceCell(row, balance, true);
    }
  }

  async function pollMoneyStatus(statusUrl, meterId) {
    try {
      const response = await fetch(statusUrl, {
        credentials: 'same-origin',
        headers: {'X-Requested-With': 'XMLHttpRequest'},
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Unable to read command status.');
      document.getElementById('prepaidMoneyPhase').textContent = data.message || 'Waiting for the meter…';
      if (data.terminal) {
        finishMoneyTracking(!!data.verified, data.error || data.message, data.balance, data.reading_at, meterId, data.operation_label, data.whatsapp_url);
        return;
      }
    } catch (error) {
      document.getElementById('prepaidMoneyPhase').textContent = `${error.message} Retrying status check…`;
    }
    moneyPoll = setTimeout(() => pollMoneyStatus(statusUrl, meterId), 1000);
  }

  function textFrom(row, selectors) {
    if (!row) return '';
    for (const selector of selectors) {
      const element = row.querySelector(selector);
      const value = (element?.textContent || '').replace(/\s+/g, ' ').trim();
      if (value) return value;
    }
    return '';
  }

  function bindPrepaidMoneyModal() {
    if (window.prepaidMoneyModalBound) return;
    const modalElement = document.getElementById('prepaidMoneyModal');
    const form = document.getElementById('prepaidMoneyForm');
    if (!modalElement || !form) return;
    if (modalElement.parentElement !== document.body) document.body.appendChild(modalElement);
    if (window.bootstrap?.Modal) {
      moneyModalController = bootstrap.Modal.getInstance(modalElement);
      if (!moneyModalController) {
        moneyModalController = new bootstrap.Modal(modalElement, {
          backdrop: 'static',
          keyboard: false,
          focus: true,
        });
      }
    }
    window.prepaidMoneyModalBound = true;

    // Delegated handlers survive Live Reading's AJAX replacement of #captureArea.
    // Always resolve the current modal/form instead of keeping references to old DOM.
    document.addEventListener('click', function (event) {
      const trigger = event.target instanceof Element ? event.target.closest('[data-prepaid-money]') : null;
      if (!trigger) return;
      // Keep the ledger link usable when Bootstrap is unavailable.
      if (!window.bootstrap?.Modal) return;
      event.preventDefault();
      try {
        stopMoneyTracking();
        moneyBusy = false;
        moneyTerminal = false;
        const row = trigger.closest('[data-meter-row]');
        const currentUnit = textFrom(row, [
          'td.col-unit', '.mobile-unit-name', '.meter-mobile-location span:nth-child(2)', '.mobile-unit'
        ]);
        const currentTenant = textFrom(row, [
          'td.col-tenant', '.mobile-full-tenant', '.meter-mobile-tenant', '.mobile-tenant'
        ]);
        const currentBalance = textFrom(row, [
          'td[data-col="balance"]', 'td.col-balance', '.mobile-balance', '.meter-mobile-metrics > div:nth-child(4) strong'
        ]);
        const operation = trigger.dataset.operation === 'refund' ? 'refund' : 'recharge';
        form.reset();
        form.querySelectorAll('input').forEach(input => { input.readOnly = false; });
        document.getElementById('prepaidMoneyAmount').value = trigger.dataset.amount || '';
        document.getElementById('prepaidMoneyConfirmation').setCustomValidity('');
        form.action = trigger.dataset.actionUrl || trigger.href;
        form.dataset.meterId = trigger.dataset.meterId || row?.dataset.meterId || row?.getAttribute('data-meter-row') || '';
        document.getElementById('prepaidMoneyOperation').value = operation;
        document.getElementById('prepaidMoneyMeterNumber').textContent = trigger.dataset.meterNumber || '—';
        document.getElementById('prepaidMoneyUnit').textContent = currentUnit || trigger.dataset.unit || trigger.dataset.location || '—';
        document.getElementById('prepaidMoneyTenant').textContent = currentTenant || trigger.dataset.tenant || 'Vacant';
        document.getElementById('prepaidMoneyCurrentBalance').textContent = currentBalance || trigger.dataset.balance || '—';
        document.getElementById('prepaidMoneyModalLabel').textContent = operation === 'refund' ? 'Refund meter balance' : 'Top up meter balance';
        document.getElementById('prepaidMoneySubmit').textContent = operation === 'refund' ? 'Submit refund' : 'Submit top up';
        document.getElementById('prepaidMoneyFields').classList.remove('d-none');
        document.getElementById('prepaidMoneyProgress').classList.add('d-none');
        document.getElementById('prepaidMoneyResult').classList.add('d-none');
        document.getElementById('prepaidMoneyWhatsApp').classList.add('d-none');
        document.getElementById('prepaidMoneyCancel').classList.remove('d-none');
        document.getElementById('prepaidMoneyCancel').disabled = false;
        document.getElementById('prepaidMoneySubmit').classList.remove('d-none');
        document.getElementById('prepaidMoneySubmit').disabled = false;
        document.getElementById('prepaidMoneyDone').classList.add('d-none');
        document.getElementById('prepaidMoneyHeaderClose').classList.remove('d-none');
        document.getElementById('prepaidMoneyHeaderClose').disabled = false;
        document.getElementById('prepaidMoneyPhase').textContent = 'Queueing the command…';
        document.getElementById('prepaidMoneyTimer').textContent = '00:00';
        if (!modalElement.classList.contains('show')) moneyModalController.show();
        modalElement.addEventListener('shown.bs.modal', () => document.getElementById('prepaidMoneyAmount')?.focus(), {once: true});
      } catch (error) {
        console.error('Unable to open prepaid money modal:', error);
        modalElement.classList.add('show');
        modalElement.style.display = 'block';
        modalElement.removeAttribute('aria-hidden');
        modalElement.setAttribute('aria-modal', 'true');
      }
    });

    document.addEventListener('submit', async function (event) {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || form.id !== 'prepaidMoneyForm') return;
      event.preventDefault();
      const amount = document.getElementById('prepaidMoneyAmount');
      const confirmation = document.getElementById('prepaidMoneyConfirmation');
      if (!amount || !confirmation) return;
      confirmation.setCustomValidity(amount.value === confirmation.value ? '' : 'The two amounts do not match.');
      if (!form.reportValidity()) return;
      const payload = new FormData(form);
      moneyBusy = true;
      moneyTerminal = false;
      form.querySelectorAll('input[type="number"], input[type="text"]').forEach(input => { input.readOnly = true; });
      document.getElementById('prepaidMoneyProgress').classList.remove('d-none');
      document.getElementById('prepaidMoneyCancel').disabled = true;
      document.getElementById('prepaidMoneySubmit').disabled = true;
      document.getElementById('prepaidMoneySubmit').textContent = 'Applying…';
      document.getElementById('prepaidMoneyHeaderClose').disabled = true;
      const bar = document.getElementById('prepaidMoneyProgressBar');
      bar.className = 'progress-bar progress-bar-striped progress-bar-animated bg-primary';
      bar.style.width = '8%';
      moneyStartedAt = Date.now();
      moneyElapsed();
      moneyTimer = setInterval(moneyElapsed, 250);
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value, 'X-Requested-With': 'XMLHttpRequest'},
          body: payload,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.error || 'The command could not be queued.');
        document.getElementById('prepaidMoneyPhase').textContent = data.message;
        pollMoneyStatus(data.status_url, form.dataset.meterId);
      } catch (error) {
        finishMoneyTracking(false, error.message || 'The command could not be queued.', '', '', form.dataset.meterId, '', '');
      }
    });

    document.addEventListener('hidden.bs.modal', function (event) {
      if (event.target?.id === 'prepaidMoneyModal') stopMoneyTracking();
    });

    document.addEventListener('input', function (event) {
      if (event.target?.id === 'prepaidMoneyConfirmation') event.target.setCustomValidity('');
    });

    modalElement.addEventListener('hide.bs.modal', function (event) {
      if (moneyBusy && !moneyTerminal) event.preventDefault();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindPrepaidMoneyModal, {once: true});
  else bindPrepaidMoneyModal();
  })();
</script>
