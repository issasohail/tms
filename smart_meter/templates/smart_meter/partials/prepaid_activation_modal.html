<div class="modal fade" id="prepaidActivationModal" tabindex="-1" aria-labelledby="prepaidActivationModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'smart_meter:prepaid_controls' %}" id="prepaidActivationForm">
        {% csrf_token %}
        <input type="hidden" name="action" value="enable_meter">
        <input type="hidden" name="meter_id" id="prepaidActivationMeterId">
        <input type="hidden" name="next" id="prepaidActivationNext" value="{{ request.get_full_path }}">
        <input type="hidden" name="submission_key" id="prepaidActivationSubmissionKey">
        <div class="modal-header">
          <h3 class="modal-title" id="prepaidActivationModalLabel">Configure tariff before prepaid</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning fs-5">
            Meter <strong id="prepaidActivationMeterNumber"></strong> has no verified tariff.
          </div>
          <label for="prepaidActivationRate" class="form-label fs-4 fw-semibold">Flat tariff per kWh</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text">Rs.</span>
            <input type="number" min="0.0001" step="0.0001" class="form-control fs-3" id="prepaidActivationRate" name="tariff_rate" required>
            <span class="input-group-text">/ kWh</span>
          </div>
          <p class="text-muted mt-3 mb-0">
            The tariff will be sent to the meter and read back for verification. Prepaid mode is saved only after the meter confirms the value.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-lg btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-lg btn-success px-4" id="prepaidActivationSubmit">
            Send tariff &amp; enable prepaid
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  (function () {
    if (window.prepaidActivationModalBound) return;
    window.prepaidActivationModalBound = true;

    function submissionKey() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (char) {
        const value = Math.random() * 16 | 0;
        return (char === 'x' ? value : (value & 3 | 8)).toString(16);
      });
    }

    function submitWithRate(sourceForm, rate) {
      ['tariff_rate', 'submission_key'].forEach(function (name) {
        sourceForm.querySelector(`[name="${name}"]`)?.remove();
      });
      const rateInput = document.createElement('input');
      rateInput.type = 'hidden';
      rateInput.name = 'tariff_rate';
      rateInput.value = rate;
      sourceForm.appendChild(rateInput);
      const keyInput = document.createElement('input');
      keyInput.type = 'hidden';
      keyInput.name = 'submission_key';
      keyInput.value = submissionKey();
      sourceForm.appendChild(keyInput);
      sourceForm.submit();
    }

    document.addEventListener('submit', function (event) {
      const sourceForm = event.target.closest('.mode-toggle-form');
      if (!sourceForm) return;
      const action = sourceForm.querySelector('[name="action"]')?.value;
      if (action !== 'enable_meter' || sourceForm.dataset.tariffVerified === '1') return;

      event.preventDefault();
      const modalElement = document.getElementById('prepaidActivationModal');
      if (!modalElement || !window.bootstrap?.Modal) {
        const rate = window.prompt('Enter the flat tariff per kWh before enabling prepaid:', sourceForm.dataset.currentRate || '');
        if (rate) submitWithRate(sourceForm, rate);
        return;
      }

      if (modalElement.parentElement !== document.body) document.body.appendChild(modalElement);
      document.getElementById('prepaidActivationMeterId').value = sourceForm.querySelector('[name="meter_id"]').value;
      document.getElementById('prepaidActivationNext').value = sourceForm.querySelector('[name="next"]')?.value || window.location.href;
      document.getElementById('prepaidActivationSubmissionKey').value = submissionKey();
      document.getElementById('prepaidActivationMeterNumber').textContent = sourceForm.dataset.meterNumber || '';
      document.getElementById('prepaidActivationRate').value = sourceForm.dataset.currentRate || '';
      bootstrap.Modal.getOrCreateInstance(modalElement).show();
      modalElement.addEventListener('shown.bs.modal', function () {
        document.getElementById('prepaidActivationRate')?.focus();
      }, {once: true});
    });

    document.getElementById('prepaidActivationForm')?.addEventListener('submit', function () {
      const button = document.getElementById('prepaidActivationSubmit');
      button.disabled = true;
      button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Sending and verifying...';
    });
  })();
</script>
