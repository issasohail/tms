{# templates/includes/meter_filters.html #}
<form method="get" id="meter-filter-form" class="meter-filter-grid mb-3">
  <div class="meter-filter-field meter-filter-property">
    <select name="property" class="form-select form-select-sm" id="mf_property" aria-label="Property filter">
      <option value="">All Properties</option>
      {% for p in all_properties %}
        <option value="{{ p.id }}" {% if current_property == p.id|stringformat:"s" %}selected{% endif %}>{{ p.property_name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="meter-filter-field meter-filter-unit">
    <select name="unit" class="form-select form-select-sm" id="mf_unit" aria-label="Unit filter">
      <option value="">All Units</option>
      {% for u in filtered_units %}
        <option value="{{ u.id }}" {% if current_unit == u.id|stringformat:"s" %}selected{% endif %}>{{ u.unit_number }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="meter-filter-field meter-filter-meter">
    <select name="meter" class="form-select form-select-sm" id="mf_meter" aria-label="Meter filter">
      <option value="">All Meters</option>
      {% for m in filtered_meters %}
        <option value="{{ m.id }}" {% if current_meter == m.id|stringformat:"s" %}selected{% endif %}>
          {{ m.meter_number }}{% if m.unit %} - {{ m.unit.unit_number }}{% endif %}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="meter-filter-field meter-filter-role">
    <select name="role" class="form-select form-select-sm" id="mf_role" aria-label="Role filter">
      <option value="">All Roles</option>
      <option value="billing" {% if current_role == "billing" %}selected{% endif %}>Billing</option>
      <option value="check" {% if current_role == "check" %}selected{% endif %}>Check / Audit</option>
    </select>
  </div>

  <div class="meter-filter-field meter-filter-active">
    <select name="active" class="form-select form-select-sm" id="mf_active" aria-label="Active status filter">
      <option value="" {% if not current_active %}selected{% endif %}>All Statuses</option>
      <option value="active" {% if current_active == "active" %}selected{% endif %}>Active</option>
      <option value="inactive" {% if current_active == "inactive" %}selected{% endif %}>Inactive</option>
    </select>
  </div>

  <div class="meter-filter-field meter-filter-tariff">
    <select name="tariff" class="form-select form-select-sm" id="mf_tariff" aria-label="Tariff type filter">
      <option value="">All Tariff Types</option>
      <option value="single_rate" {% if current_tariff == "single_rate" %}selected{% endif %}>Single-rate</option>
      <option value="multi_rate" {% if current_tariff == "multi_rate" %}selected{% endif %}>Multi-rate</option>
      <option value="unknown" {% if current_tariff == "unknown" %}selected{% endif %}>Unknown</option>
    </select>
  </div>

  <div class="meter-filter-actions">
    <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-filter"></i><span> Filter</span></button>
    {% if request.GET %}
      <a href="{% url 'smart_meter:meter_list' %}" class="btn btn-sm btn-outline-secondary" title="Clear filters"><i class="fas fa-undo"></i></a>
    {% endif %}
  </div>
</form>

<style>
  .meter-filter-grid {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) minmax(130px, .8fr) minmax(180px, 1fr) minmax(135px, .75fr) minmax(130px, .7fr) minmax(145px, .8fr) auto;
    gap: .5rem;
    align-items: center;
  }
  .meter-filter-field { min-width: 0; }
  .meter-filter-field .form-select { width: 100%; }
  .meter-filter-field .select2-container { width: 100% !important; }
  .meter-filter-field .select2-container--bootstrap-5 .select2-selection--single {
    min-height: 31px;
    height: 31px;
    font-size: .875rem;
  }
  .meter-filter-actions { display: flex; gap: .35rem; white-space: nowrap; }

  @media (max-width: 767.98px) {
    .meter-filter-grid {
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: .45rem;
    }
    .meter-filter-property,
    .meter-filter-unit { grid-column: span 6; }
    .meter-filter-meter { grid-column: span 5; }
    .meter-filter-role,
    .meter-filter-active,
    .meter-filter-tariff { grid-column: span 4; }
    .meter-filter-actions { grid-column: span 3; }
    .meter-filter-actions .btn { min-height: 31px; }
    .meter-filter-actions .btn-primary span { display: none; }
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById('meter-filter-form');
  const property = document.getElementById('mf_property');
  const unit = document.getElementById('mf_unit');
  const meter = document.getElementById('mf_meter');
  const role = document.getElementById('mf_role');
  const active = document.getElementById('mf_active');
  const tariff = document.getElementById('mf_tariff');

  if (window.jQuery?.fn?.select2) {
    const $ = window.jQuery;
    $(form).find('select').each(function () {
      const $select = $(this);
      let closing = false;
      $select.select2({ theme: 'bootstrap-5', width: '100%' });
      $select.on('select2:open', function () {
        window.setTimeout(function () {
          document.querySelector('.select2-container--open .select2-search__field')?.focus();
        }, 0);
      });
      $select.on('select2:close', function () {
        closing = true;
        window.setTimeout(function () { closing = false; }, 0);
      });
      $select.next('.select2-container').find('.select2-selection').on('focusin', function () {
        if (!closing && !$select.next('.select2-container').hasClass('select2-container--open')) {
          $select.select2('open');
        }
      });
    });
  }

  const onFilterChange = (element, handler) => {
    if (window.jQuery?.fn?.select2) window.jQuery(element).on('change', handler);
    else element?.addEventListener('change', handler);
  };
  onFilterChange(property, () => { unit.value = ''; meter.value = ''; form.submit(); });
  onFilterChange(unit, () => { meter.value = ''; form.submit(); });
  onFilterChange(meter, () => form.submit());
  onFilterChange(role, () => form.submit());
  onFilterChange(active, () => form.submit());
  onFilterChange(tariff, () => form.submit());
});
</script>
