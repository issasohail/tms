{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-2 px-md-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">{% if object %}Edit Lead{% else %}Add Lead{% endif %}</h3>
        <a href="{% url 'tenants:lead_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <form method="post" class="card">
        {% csrf_token %}
        <div class="card-body">
            <div class="row g-3">
                {% for field in form %}
                <div class="col-md-{% if field.name == 'notes' %}12{% else %}6{% endif %}">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-2">
            <a href="{% url 'tenants:lead_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            <button class="btn btn-primary btn-sm">Save</button>
        </div>
    </form>
</div>
{% endblock %}
