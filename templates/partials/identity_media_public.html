{% load static %}
<style>
  .tms-public-image-viewer[hidden] { display:none!important; }
  .tms-public-image-viewer{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.88)}
  .tms-public-image-panel{position:relative;width:min(1200px,100%);max-height:94vh;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:#111;overflow:hidden}
  .tms-public-image-title{min-height:42px;padding:10px 54px 8px 14px;color:#fff;font:600 15px/1.4 Arial,sans-serif}
  .tms-public-image-close{position:absolute;top:7px;right:9px;z-index:2;width:32px;height:32px;border:0;border-radius:50%;color:#fff;background:rgba(255,255,255,.16);font-size:24px;line-height:28px;cursor:pointer}
  .tms-public-image-main{display:block;width:100%;max-height:calc(94vh - 98px);object-fit:contain;background:#111}
  .tms-public-image-actions{display:flex;justify-content:flex-end;gap:8px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.18)}
  .tms-public-image-actions a,.tms-public-image-actions button{padding:7px 12px;border:0;border-radius:5px;color:#fff;background:#2563eb;font:600 13px/1.2 Arial,sans-serif;text-decoration:none;cursor:pointer}
  .tms-public-image-actions button{background:#4b5563}.tms-public-image-trigger{cursor:zoom-in!important}
  .tms-identity-status{grid-column:1/-1;margin:.55rem .75rem 0;padding:.55rem .7rem;border:1px solid #bfdbfe;border-radius:.5rem;background:#eff6ff;color:#1e40af;font-size:.76rem;font-weight:700;line-height:1.35}
  .tms-identity-status.is-reading{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.tms-identity-status.is-success{border-color:#86efac;background:#f0fdf4;color:#166534}.tms-identity-status.is-error{border-color:#fca5a5;background:#fef2f2;color:#b91c1c}
  .tms-identity-status .spinner-border{width:.85rem;height:.85rem;border-width:.12rem;margin-right:.35rem;vertical-align:-.1rem}
  .tms-selected-preview{display:flex;align-items:center;justify-content:center;width:100%;height:92px;margin-top:.35rem;border:1px solid #d1d5db;border-radius:.42rem;background:#f8fafc;overflow:hidden}
  .tms-selected-preview img{width:100%;height:100%;object-fit:contain;background:#fff}
  .tms-identity-locked{opacity:.62}.tms-identity-locked input,.tms-identity-locked select,.tms-identity-locked textarea{cursor:not-allowed}
  .tms-cnic-readonly{background:#f3f4f6!important;cursor:not-allowed}

  .td-form-doc-actions {
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:.3rem;
    margin-top:.3rem;
    width:100%;
  }
  .td-form-doc-actions .td-form-upload-btn,
  .td-form-doc-actions .td-form-read-cnic-btn {
    width:100%!important;
    min-width:0;
    margin-top:0!important;
    min-height:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.25rem;
    padding:.22rem .35rem;
    border-radius:.45rem;
    font-size:.68rem;
    font-weight:800;
    line-height:1.1;
    white-space:normal;
    text-align:center;
  }
  .td-form-doc-actions .td-form-read-cnic-btn {
    border:1px solid #0d6efd;
    color:#0d6efd;
    background:#fff;
    text-decoration:none;
  }

</style>
<div class="tms-public-image-viewer" id="tmsPublicImageViewer" hidden role="dialog" aria-modal="true" aria-labelledby="tmsPublicImageTitle"><div class="tms-public-image-panel"><div class="tms-public-image-title" id="tmsPublicImageTitle">Image Preview</div><button type="button" class="tms-public-image-close" id="tmsPublicImageClose" aria-label="Close">&times;</button><img class="tms-public-image-main" id="tmsPublicImageMain" src="" alt="Image preview"><div class="tms-public-image-actions"><a id="tmsPublicImageSave" href="#" download>Save Image</a><button type="button" id="tmsPublicImageCloseBottom">Close</button></div></div></div>
<script>
window.TMS_USES_IDENTITY_MEDIA_PUBLIC = true;
(function(){
  const viewer=document.getElementById('tmsPublicImageViewer'),main=document.getElementById('tmsPublicImageMain'),title=document.getElementById('tmsPublicImageTitle'),save=document.getElementById('tmsPublicImageSave');
  const states=new WeakMap(); const ocrRunners=new WeakMap(); let pendingCount=0;
  function csrfToken(form){const f=form?.querySelector('[name=csrfmiddlewaretoken]');if(f?.value)return f.value;const m=document.cookie.match(/(^|; )csrftoken=([^;]*)/);return m?decodeURIComponent(m[2]):''}
  function prefixOf(input){const n=String(input.name||''),s='cnic_front';return n.endsWith(s)?n.slice(0,-s.length):''}
  function contextFor(front){const form=front.form||front.closest('form')||document,prefix=prefixOf(front);let container=front.closest('.family-member-card,.party-role-card');if(!container)container=form;return{form,prefix,container,isMain:!prefix}}
  function field(context,name){const aliases={full_name:['full_name','name','first_name'],first_name:['first_name','name'],last_name:['last_name','father_husband_name'],date_of_birth:['date_of_birth','dob'],temporary_address:['temporary_address','address'],permanent_address:['permanent_address','address']}[name]||[name];for(const a of aliases){for(const n of [`${context.prefix}${a}`,a]){const el=context.container.querySelector(`[name="${CSS.escape(n)}"]`);if(el)return el}}return null}
  function cnicField(context){return field(context,'cnic')}
  function setSubmitPending(form,on){pendingCount=Math.max(0,pendingCount+(on?1:-1));document.querySelectorAll('button[type="submit"],input[type="submit"]').forEach(b=>{if(b.form===form||b.getAttribute('form')===form.id){if(on)b.dataset.ocrDisabled=b.disabled?'was-disabled':'enabled';if(pendingCount)b.disabled=true;else if(b.dataset.ocrDisabled==='enabled')b.disabled=false}})}
  function statusHost(context,back){if(context.isMain){const docs=back.closest('.td-card');return docs?.querySelector('.td-form-doc-grid')||docs||back.parentElement}return context.container.querySelector('.party-card-body,.family-member-grid')||context.container}
  function ensureStatus(context,back){let s=context.container.querySelector(':scope > .tms-identity-status,.party-card-body > .tms-identity-status,.family-member-grid > .tms-identity-status,.td-form-doc-grid > .tms-identity-status');if(!s){s=document.createElement('div');s.className='tms-identity-status';statusHost(context,back).prepend(s)}return s}
  function shouldLockMain(){return window.TMS_IDENTITY_LOCK_MAIN!==false}
  function controls(context){if(context.isMain)return Array.from(context.form.elements);return Array.from(context.container.querySelectorAll('input,select,textarea,button'))}
  function isIdentityControl(el,context){if(el.type==='file')return true;if(el.name==='csrfmiddlewaretoken')return true;if(el.type==='hidden')return true;if(el.classList?.contains('remove-family-member'))return true;return false}
  function lock(context,on){if(context.isMain&&!shouldLockMain())return;controls(context).forEach(el=>{if(isIdentityControl(el,context))return;if(el.type==='submit'||el.getAttribute('form')===context.form.id)return;if(on){if(!('ocrWasDisabled'in el.dataset))el.dataset.ocrWasDisabled=el.disabled?'1':'0';el.disabled=true;el.closest('.td-form-cell,.field-wrap,.party-card-body>div')?.classList.add('tms-identity-locked')}else{if(el.dataset.ocrWasDisabled==='0')el.disabled=false;el.closest('.td-form-cell,.field-wrap,.party-card-body>div')?.classList.remove('tms-identity-locked')}});const c=cnicField(context);if(c){c.disabled=false;c.readOnly=true;c.classList.add('tms-cnic-readonly')}}
  function previewInput(input){if(input.dataset.tmsPreview==='1')return;input.dataset.tmsPreview='1';input.addEventListener('change',()=>{const f=input.files?.[0];let box=input.parentElement?.querySelector(':scope > .tms-selected-preview');if(!f){box?.remove();return}if(!f.type.startsWith('image/')){input.value='';alert('Please select an image file.');box?.remove();return}if(!box){box=document.createElement('div');box.className='tms-selected-preview';input.insertAdjacentElement('afterend',box)}const img=document.createElement('img');img.alt='Selected image preview';img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);box.replaceChildren(img)})}
  function arrangeMainDocumentActions(root){
    const grids=Array.from(document.querySelectorAll('.tms-main-document-grid,.td-form-doc-grid'));
    grids.forEach(grid=>{
      const card=grid.closest('.td-form-documents-card,.td-card')||grid.parentElement;
      const frontSlot=grid.querySelector('.cnic-front-slot')||grid.querySelector(':scope > .td-form-doc-slot:nth-child(1)');
      const backSlot=grid.querySelector('.cnic-back-slot')||grid.querySelector(':scope > .td-form-doc-slot:nth-child(2)');
      const photoSlot=grid.querySelector('.tenant-photo-slot')||grid.querySelector(':scope > .td-form-doc-slot:nth-child(3)');
      frontSlot?.classList.add('cnic-front-slot');
      backSlot?.classList.add('cnic-back-slot');
      photoSlot?.classList.add('tenant-photo-slot');
      grid.classList.add('tms-main-document-grid');
      if(!backSlot)return;

      let actions=backSlot.querySelector('.td-form-doc-actions-back');
      if(!actions){
        actions=document.createElement('div');
        actions.className='td-form-doc-actions td-form-doc-actions-back';
        const upload=backSlot.querySelector('.td-form-upload-btn');
        if(upload){upload.insertAdjacentElement('beforebegin',actions);actions.appendChild(upload)}
        else backSlot.appendChild(actions);
      }

      const explicit=actions.querySelector('.tms-read-cnic-button');
      const candidates=Array.from((card||document).querySelectorAll('button,a,label,input[type="button"]'));
      candidates.forEach(el=>{
        const text=(el.value||el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
        if(!text.includes('read cnic detail'))return;
        if(explicit && el!==explicit){el.remove();return}
        if(!actions.contains(el))actions.appendChild(el);
        el.classList.add('td-form-read-cnic-btn','tms-read-cnic-button');
      });
    });

    document.querySelectorAll('small,.form-text,.text-muted,p,span,div').forEach(el=>{
      if(el.closest('.tms-identity-status'))return;
      const own=Array.from(el.childNodes).filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim().toLowerCase();
      if(own.includes('upload both sides')&&own.includes('blank fields will fill'))el.remove();
    });
  }
  function installPreviews(root){(root||document).querySelectorAll('input[type="file"][accept*="image"],input[type="file"][name*="photo"],input[type="file"][name*="cnic_"]').forEach(previewInput)}
  function installOcr(root){if(!window.TMS_PUBLIC_CNIC_OCR_URL)return;(root||document).querySelectorAll('input[type="file"]').forEach(front=>{if(!String(front.name||'').endsWith('cnic_front')||front.dataset.tmsOcr==='1')return;const context=contextFor(front),back=context.form.querySelector(`[name="${CSS.escape(context.prefix+'cnic_back')}"]`);if(!back)return;front.dataset.tmsOcr='1';const storedUrl=context.isMain?window.TMS_STORED_CNIC_OCR_URL:'';const status=ensureStatus(context,back);status.textContent=storedUrl?'Click Read CNIC Details to read the saved CNIC images.':(context.isMain?'Please upload CNIC front and back first.':'Please upload CNIC/B-Form front and back first.');lock(context,true);let seq=0,timer=null,start=0;
      function stopTimer(){if(timer)clearInterval(timer);timer=null}
      async function run(){const frontFile=front.files?.[0],backFile=back.files?.[0],useStored=Boolean(storedUrl&&!frontFile&&!backFile);if((!frontFile||!backFile)&&!useStored){lock(context,true);status.className='tms-identity-status is-error';status.textContent=context.isMain?'Please upload CNIC front and back first.':'Please upload CNIC/B-Form front and back first.';return}const request=++seq;start=Date.now();status.className='tms-identity-status is-reading';const tick=()=>{const sec=Math.max(0,Math.floor((Date.now()-start)/1000));status.innerHTML='<span class="spinner-border" aria-hidden="true"></span>Please wait while your CNIC scan is being read to fetch data — '+sec+' second'+(sec===1?'':'s')};tick();timer=setInterval(tick,1000);setSubmitPending(context.form,true);const body=new FormData(),token=csrfToken(context.form);if(!useStored){body.append('cnic_front',frontFile);body.append('cnic_back',backFile)}body.append('csrfmiddlewaretoken',token);
        try {
          const r=await fetch(useStored?storedUrl:window.TMS_PUBLIC_CNIC_OCR_URL,{method:'POST',headers:{'X-CSRFToken':token,'X-Requested-With':'XMLHttpRequest'},body});
          const text=await r.text();
          let p;
          try{p=JSON.parse(text)}catch(_){throw new Error(`CNIC OCR returned an unexpected response (HTTP ${r.status}).`)}
          if(request!==seq)return;
          if(!r.ok||!p.ok)throw new Error(p.message||`CNIC OCR failed (HTTP ${r.status}).`);
          let written=0,retained=0,loadedExisting=0;
          const writeVisible=(s,promptOnDifference=false)=>{
            const target=field(context,s.name);
            if(!target)return false;
            const old=String(target.value||'').trim(),incoming=String(s.value||'').trim();
            if(!incoming)return false;
            const sameValue=s.name==='cnic'
              ? old.replace(/\D/g,'')===incoming.replace(/\D/g,'')
              : old===incoming;
            if(old&&!sameValue){
              if(!promptOnDifference){
                retained++;
                return false;
              }
              const label=s.label||String(s.name||'Field').replace(/_/g,' ');
              const useCnic=window.confirm(
                `${label} is different.\n\nCurrent value:\n${old}\n\nCNIC value:\n${incoming}\n\nPress OK to use the CNIC value, or Cancel to keep the current value.`
              );
              if(!useCnic){
                retained++;
                return false;
              }
            }
            target.value=s.value||'';
            target.dispatchEvent(new Event('input',{bubbles:true}));
            target.dispatchEvent(new Event('change',{bubbles:true}));
            return String(target.value||'').trim()===incoming;
          };
          (p.existing_tenant?.fields||[]).forEach(s=>{if(writeVisible(s,false))loadedExisting++});
          (p.fields||[]).forEach(s=>{if(writeVisible(s,Boolean(p.can_overwrite)))written++});
          if(p.portrait_data_uri){
            let hidden=context.form.querySelector(`[name="${CSS.escape(context.prefix+'cnic_portrait_data')}"]`);
            if(!hidden){
              hidden=document.createElement('input');
              hidden.type='hidden';
              hidden.name=context.prefix+'cnic_portrait_data';
              hidden.className='tms-cnic-portrait-data';
              context.container.appendChild(hidden);
            }
            const photoInput=field(context,'photo');
            const photoSlot=context.isMain?context.form.querySelector('.tenant-photo-slot'):photoInput?.closest('.field-wrap,.file-box,.form-group');
            const existingPreview=Array.from(photoSlot?.querySelectorAll('img:not([data-tms-cnic-portrait-preview])')||[]).find(img=>img.getAttribute('src'));
            if(!photoInput?.files?.length&&!existingPreview){
              hidden.value=p.portrait_data_uri;
              let preview=photoSlot?.querySelector('[data-tms-cnic-portrait-preview]')||(!context.isMain?photoSlot?.querySelector('.preview-img'):null);
              if(!preview){
                preview=document.createElement('img');
                preview.className=context.isMain?'public-file-preview':'preview-img';
                preview.alt='Photo extracted from CNIC';
                const host=context.isMain?photoSlot?.querySelector('.td-form-doc-preview'):photoSlot?.querySelector('.preview-row');
                if(host){host.querySelector('i')?.remove();host.prepend(preview)}
                else if(photoInput)photoInput.insertAdjacentElement('afterend',preview);
              }
              preview.dataset.tmsCnicPortraitPreview='1';
              preview.src=p.portrait_data_uri;
              preview.style.display='block';
            }
          }
          lock(context,false);
          const c=cnicField(context);
          if(c){c.readOnly=true;c.classList.add('tms-cnic-readonly')}
          status.className='tms-identity-status is-success';
          if(p.existing_tenant?.matched){
            status.textContent=`CNIC front and back numbers verified. An existing tenant record was found and ${loadedExisting} saved visible field(s) were loaded. ${written} OCR field(s) were accepted. This submission will reuse the existing record after staff approval.`;
          }else{
            status.textContent=`CNIC front and back numbers verified. ${written} visible field(s) accepted${retained?`; ${retained} current value(s) kept`:''}. Please complete the remaining information.`;
          }
          status.title=(p.warnings||[]).join(' ');
        }catch(e){
          if(request!==seq)return;
          const allowManualEntry=context.isMain&&window.TMS_CNIC_ALLOW_MANUAL_ENTRY===true;
          lock(context,!allowManualEntry);
          if(allowManualEntry){const c=cnicField(context);if(c){c.disabled=false;c.readOnly=false;c.classList.remove('tms-cnic-readonly')}}
          status.className='tms-identity-status is-error';
          status.textContent=(e.message||'CNIC could not be read.')+(allowManualEntry?' You can enter or correct the details manually.':' Please verify both images and upload clearer copies.');
        }finally{
          if(request===seq){stopTimer();setSubmitPending(context.form,false)}
        }}
      ocrRunners.set(context.container,run); ocrRunners.set(context.form,run);
      function changed(){const hidden=context.form.querySelector(`[name="${CSS.escape(context.prefix+'cnic_portrait_data')}"]`);if(hidden)hidden.value='';const preview=context.container.querySelector('[data-tms-cnic-portrait-preview]');if(preview?.closest('.preview-row')){preview.removeAttribute('src');preview.style.display='none';delete preview.dataset.tmsCnicPortraitPreview}else preview?.remove();seq++;stopTimer();run()}front.addEventListener('change',changed);back.addEventListener('change',changed)
    })}
  function imageItem(target){const image=target.closest?.('img');if(!image||image.closest('#tmsPublicImageViewer'))return null;const link=image.closest('a'),url=link?.href||image.currentSrc||image.src||'';return /\/media\/|^blob:|^data:image\//i.test(url)?{url,image}:null}
  function openViewer(item){const caption=item.image.alt||'Image Preview';main.src=item.url;main.alt=caption;title.textContent=caption;save.href=item.url;viewer.hidden=false;document.body.style.overflow='hidden'}function closeViewer(){viewer.hidden=true;main.src='';document.body.style.overflow=''}
  function install(root){installPreviews(root);installOcr(root);arrangeMainDocumentActions(document)}
  document.addEventListener('DOMContentLoaded',()=>{
    install(document);
    new MutationObserver(m=>{
      m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1){installPreviews(n);installOcr(n)}}));
      arrangeMainDocumentActions(document);
    }).observe(document.body,{childList:true,subtree:true});
  });
  document.addEventListener('click',e=>{
    const readButton=e.target.closest?.('.tms-read-cnic-button');
    if(readButton){
      e.preventDefault();
      const grid=readButton.closest('.tms-main-document-grid,.td-form-doc-grid');
      const front=grid?.querySelector('input[type="file"][name$="cnic_front"]');
      const context=front?contextFor(front):null;
      const runner=context?(ocrRunners.get(context.container)||ocrRunners.get(context.form)):null;
      if(runner)runner();
      return;
    }
    const item=imageItem(e.target);if(!item)return;e.preventDefault();openViewer(item)
  },true);document.getElementById('tmsPublicImageClose')?.addEventListener('click',closeViewer);document.getElementById('tmsPublicImageCloseBottom')?.addEventListener('click',closeViewer);viewer?.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)closeViewer()})
})();
</script>
