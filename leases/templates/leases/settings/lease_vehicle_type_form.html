{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Edit Lease Vehicle Type</h4>
    <a href="{% url 'leases:lease_vehicle_type_settings' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
  </div>

  <form method="post" class="border rounded p-3 bg-light" style="max-width: 720px;">
    {% csrf_token %}
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <label class="form-label small mb-1">Name</label>
        {{ form.name }}
        {{ form.name.errors }}
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label small mb-1">Code</label>
        {{ form.code }}
        {{ form.code.errors }}
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label small mb-1">Sort Order</label>
        {{ form.sort_order }}
      </div>
      <div class="col-6 col-md-4">
        <label class="form-label small d-block mb-1">Active</label>
        {{ form.is_active }}
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <a href="{% url 'leases:lease_vehicle_type_settings' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
