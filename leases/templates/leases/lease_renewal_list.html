{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<style>
  .renewal-page { max-width:1100px; }
  @media (max-width:575.98px) {
    .renewal-page { padding-left:.5rem; padding-right:.5rem; }
    .renewal-page h2 { font-size:1.25rem; }
  }
</style>
<div class="container mt-3 renewal-page">
  <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
    <h2 class="mb-0">Lease #{{ lease.id }} Renewal History</h2>
    <a href="{% url 'leases:lease_detail' lease.pk %}" class="btn btn-secondary btn-sm">Back</a>
  </div>

  {% include 'leases/renewal_history_table.html' with lease=lease renewals=lease.renewals.all %}
</div>
{% endblock %}
